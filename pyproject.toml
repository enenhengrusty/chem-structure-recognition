[project]
name = "chem-structure-recognition"
version = "2.0.0"
description = "Handwritten chemistry lab-note recognition & self-correction workflow plugin with RDKit MW reverse-audit, ACS 1996 PNG/SVG rendering, stoichiometry table auditing, and science plugin integration."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "rdkit>=2023.9.1",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
]

[project.urls]
Homepage = "https://github.com/enenhengrusty/chem-structure-recognition"
Repository = "https://github.com/enenhengrusty/chem-structure-recognition"
