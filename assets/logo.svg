<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="gradRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="gradAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Background Circle (Soft Glow) -->
  <circle cx="64" cy="64" r="58" fill="#0f172a" stroke="url(#gradRing)" stroke-width="3" opacity="0.95"/>

  <!-- Scanning Target Crosshairs & Brackets -->
  <path d="M 24 40 L 24 24 L 40 24" fill="none" stroke="url(#gradAccent)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 104 40 L 104 24 L 88 24" fill="none" stroke="url(#gradAccent)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 24 88 L 24 104 L 40 104" fill="none" stroke="url(#gradAccent)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 104 88 L 104 104 L 88 104" fill="none" stroke="url(#gradAccent)" stroke-width="3" stroke-linecap="round"/>

  <!-- Outer Benzene Ring Structure -->
  <polygon points="64,32 90,47 90,77 64,92 38,77 38,47" 
           fill="none" stroke="#f8fafc" stroke-width="4.5" stroke-linejoin="round"/>

  <!-- Inner Aromatic Ring (Dashed or Concentric) -->
  <circle cx="64" cy="62" r="16" fill="none" stroke="url(#gradAccent)" stroke-width="2.5" stroke-dasharray="7 5"/>

  <!-- Functional Group Nodes & Bonds -->
  <line x1="90" y1="47" x2="108" y2="38" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
  <circle cx="108" cy="38" r="4.5" fill="#ef4444"/>

  <line x1="38" y1="77" x2="20" y2="86" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
  <circle cx="20" cy="86" r="4.5" fill="#3b82f6"/>

  <line x1="64" y1="92" x2="64" y2="108" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
  <circle cx="64" cy="108" r="4.5" fill="#10b981"/>

  <!-- Optical Recognition Node / Focus Center -->
  <circle cx="64" cy="62" r="5" fill="#38bdf8"/>
</svg>
